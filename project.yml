name: PumpRadar
options:
  bundleIdPrefix: com.pumpradar
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    CODE_SIGN_STYLE: Automatic

targets:
  PumpRadar:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PumpRadar
        excludes:
          - "**/*.md"
          - Resources/Info.plist
          - Resources/Demo
          - Resources/Demo/**
      - path: PumpRadar/Resources/Demo
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pumpradar.ios
        INFOPLIST_FILE: PumpRadar/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets:
        - PumpRadarTests

  PumpRadarTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PumpRadarTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pumpradar.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PumpRadar.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PumpRadar
    dependencies:
      - target: PumpRadar
