included:
  - PumpRadar
  - PumpRadarTests

excluded:
  - PumpRadar/Resources
  - .build
  - DerivedData

disabled_rules:
  - trailing_whitespace
  - todo

line_length:
  warning: 140
  error: 220
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 80
  error: 160

file_length:
  warning: 550
  error: 900

type_body_length:
  warning: 400
  error: 700

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y
    - to
    - vm

nesting:
  type_level:
    warning: 3

type_name:
  min_length: 3
  excluded:
    - ID

function_parameter_count:
  warning: 8
  error: 16

cyclomatic_complexity:
  warning: 15
  error: 40
