# .swiftlint.yml
# SwiftLint configuration for PumpRadar iOS application.
# Enforces consistent code style and catches common Swift mistakes.
# See https://github.com/realm/SwiftLint for rule documentation.

# Paths to include in linting
included:
  - PumpRadar
  - PumpRadarTests

# Paths to exclude from linting
excluded:
  - PumpRadar/Resources
  - .build
  - Pods
  - DerivedData

# Rules to disable globally (uncomment or add as needed)
disabled_rules:
  - trailing_whitespace          # Handled by editor auto-formatting

# Rules to opt into (not enabled by default)
opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - first_where
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - static_operator
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

# Customise individual rule parameters
line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 60
  error: 100

file_length:
  warning: 400
  error: 600

type_body_length:
  warning: 250
  error: 400

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y
    - vm

nesting:
  type_level:
    warning: 3
  function_level:
    warning: 4

# Naming conventions
type_name:
  min_length: 3
  excluded:
    - ID
