# ios.yml
# GitHub Actions CI/CD workflow for the PumpRadar iOS application.
#
# Workflow steps:
#   1. Checkout source code
#   2. Select the target Xcode version
#   3. Install XcodeGen and generate the .xcodeproj
#   4. Run SwiftLint for code quality checks
#   5. Build the app (Debug scheme, no-code-signing)
#   6. Run unit tests
#   7. Upload test results as artifacts

name: iOS CI

on:
  push:
    branches: [main, develop, "feature/**", "bugfix/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Restrict GITHUB_TOKEN permissions to the minimum required
permissions:
  contents: read

env:
  XCODE_VERSION: "15.2"
  SCHEME: PumpRadar
  DERIVED_DATA: DerivedData

jobs:
  # ──────────────────────────────────────────────────────────
  # Lint
  # ──────────────────────────────────────────────────────────
  lint:
    name: SwiftLint
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run SwiftLint
        run: |
          if which swiftlint > /dev/null; then
            swiftlint lint --reporter github-actions-logging
          else
            brew install swiftlint
            swiftlint lint --reporter github-actions-logging
          fi

  # ──────────────────────────────────────────────────────────
  # Build & Test
  # ──────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: macos-14
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme "${{ env.SCHEME }}" \
            -derivedDataPath "${{ env.DERIVED_DATA }}"

      - name: Build
        run: |
          xcodebuild build \
            -scheme "${{ env.SCHEME }}" \
            -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" \
            -derivedDataPath "${{ env.DERIVED_DATA }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty --color --simple && exit "${PIPESTATUS[0]}"

      - name: Run tests
        run: |
          xcodebuild test \
            -scheme "${{ env.SCHEME }}" \
            -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" \
            -derivedDataPath "${{ env.DERIVED_DATA }}" \
            -resultBundlePath TestResults/results.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty --color --simple && exit "${PIPESTATUS[0]}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: TestResults/
          retention-days: 14

      - name: Upload derived data (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: derived-data-${{ github.run_number }}
          path: ${{ env.DERIVED_DATA }}/
          retention-days: 3
